name: Build Windows (Artifact)

# win-x64 构建，产物仅上传为 artifact，不创建 Release。
# 依赖官方发布工具 `run --rids win-x64`；无签名证书时签名自动跳过。

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-windows

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-windows-x64:
    name: Windows x64 → artifact
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # AppHost 与 CopyRuntime 硬编码 runtime 11.0.0-rc.3.26522.148，SDK 必须同版本
          dotnet-version: '11.0.100-rc.3.26522.148'

      - name: Prepare environment
        shell: pwsh
        run: |
          dotnet --info
          # 放开 global.json 的 prerelease 限制
          $g = Get-Content global.json -Raw | ConvertFrom-Json
          $g.sdk.version = '11.0.100-rc.3.26522.148'
          $g.sdk.allowPrerelease = $true
          $g | ConvertTo-Json -Depth 5 | Set-Content global.json -Encoding UTF8

          # 依赖断言：7z.dll（SevenZipSharp 打包用）、Windows SDK（makepri/makeappx）、
          # shared frameworks（CopyRuntime 按版本目录整拷，缺目录会静默跳过）
          $deps = @(
            (Join-Path $env:ProgramFiles '7-Zip\7z.dll'),
            'C:\Program Files (x86)\Windows Kits\10\bin',
            'C:\Program Files\dotnet\shared\Microsoft.NETCore.App\11.0.0-rc.3.26522.148',
            'C:\Program Files\dotnet\shared\Microsoft.AspNetCore.App\11.0.0-rc.3.26522.148',
            'C:\Program Files\dotnet\shared\Microsoft.WindowsDesktop.App\11.0.0-rc.3.26522.148'
          )
          $deps | Where-Object { -not (Test-Path $_) } | ForEach-Object { throw "Missing: $_" }

      - name: Publish win-x64
        run: dotnet run --project src/BD.WTTS.Client.Tools.Publish -c Release -- run --rids win-x64

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE '_artifacts'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          # 产物文件名含 "[Release] " 前缀，方括号会被 PS 当通配符，须用 -LiteralPath
          Get-ChildItem 'src/BD.WTTS.Client.Avalonia.App/bin/Release' -Recurse -Include *.7z, *.msix |
            ForEach-Object {
              $dst = Join-Path $out ($_.Name -replace '^\[Release\] ', '')
              Copy-Item -LiteralPath $_.FullName -Destination $dst -Force
              Write-Host "collected: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
            }
          if (-not (Get-ChildItem -LiteralPath $out)) { throw 'No artifacts collected' }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Steam++_win-x64_${{ github.run_number }}
          path: _artifacts/
          retention-days: 7
          if-no-files-found: error
